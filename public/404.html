<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page Not Found</title>
    <meta name="robots" content="noindex">
  </head>
  <body>
    <script>
      // SPA fallback for GitHub Pages: load the app index so client router can handle the path
      (function () {
        var repoBase = '/PROchure.app-admin/index.html';
        fetch(repoBase)
          .then(function (r) { return r.text(); })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function () {
            document.body.innerHTML = '<h1>404 — Page not found</h1>';
          });
      })();
    </script>
  </body>
</html>
